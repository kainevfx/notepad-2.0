var P=[{"file":"readme-master-plan.md","title":"Master plan","html":"\u003ch1>Notepad 2.0: master plan\u003c/h1>\n\u003cp>\u003cem>Created 2026-09-27 by developer. Status: planned, awaiting Kaine&#39;s decisions (see \u003ccode>questions-approvals-and-decisions.md\u003c/code>).\u003c/em>\u003c/p>\n\u003cp>Sub-documents in this folder:\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>task-at-hand-summary.md\u003c/code> what was asked, feature list F1 to F8, screenshot reading\u003c/li>\n\u003cli>\u003ccode>current-and-existing-audit.md\u003c/code> what exists today (Win11 Notepad, Notepad++, competitors) and what we replace\u003c/li>\n\u003cli>\u003ccode>sub-plan-breakdown-item-01.md\u003c/code> to \u003ccode>-07.md\u003c/code> one per feature area\u003c/li>\n\u003cli>\u003ccode>file-structure-logic-integration.md\u003c/code> repo layout, data files, registry keys\u003c/li>\n\u003cli>\u003ccode>questions-approvals-and-decisions.md\u003c/code> what only Kaine can decide\u003c/li>\n\u003cli>\u003ccode>kaine-action-items-to-complete.md\u003c/code> steps on the Home PC\u003c/li>\n\u003cli>\u003ccode>verification-feature-test.md\u003c/code> acceptance tests per feature\u003c/li>\n\u003cli>\u003ccode>agent-suggested-improvements.md\u003c/code> extras worth adding\u003c/li>\n\u003cli>\u003ccode>dossier-feature-development-memory-record.md\u003c/code> append-only build log\u003c/li>\n\u003cli>\u003ccode>interactive-master-document.html\u003c/code> all of the above in one self-contained page\u003c/li>\n\u003c/ul>\n\u003ch2>1. Recommended stack\u003c/h2>\n\u003cp>\u003cstrong>Tauri 2 (Rust shell) + TypeScript/Preact UI + CodeMirror 6 editor + unified/remark Markdown pipeline.\u003c/strong>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Need\u003c/th>\n\u003cth>How the stack covers it\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Looks exactly like Win11 Notepad\u003c/td>\n\u003ctd>Tauri 2 \u003ccode>windowEffects: mica\u003c/code>, custom title bar with the tab strip in it (same as Notepad), Fluent 2 tokens (Segoe UI Variable, Notepad spacing), follows Windows light/dark. \u003ccode>tauri-plugin-decorum\u003c/code> keeps the Win11 Snap Layouts flyout on the custom maximise button.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Big files, line numbers, paper backgrounds\u003c/td>\n\u003ctd>CodeMirror 6 renders only the viewport (fine at 50 MB+), has a native line-number gutter, and its content layer takes CSS backgrounds for Grid and Lines.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Markdown with zero rendering errors\u003c/td>\n\u003ctd>\u003ccode>micromark\u003c/code> (the parser behind remark) is 100% CommonMark and GFM spec compliant. Tables, task lists, footnotes, strikethrough, autolinks, front matter, HTML (sanitised), KaTeX maths, Mermaid, Shiki code highlighting.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Tray + Quick Note bubble\u003c/td>\n\u003ctd>Tauri 2 has a built-in tray API, multi-window, global shortcuts and \u003ccode>single-instance\u003c/code> plugin.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>File associations + Notepad replacement\u003c/td>\n\u003ctd>Tauri bundler writes ProgIDs from \u003ccode>bundle.fileAssociations\u003c/code>; a small Rust module writes Capabilities / RegisteredApplications / IFEO keys.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Size and speed\u003c/td>\n\u003ctd>~8 to 12 MB installer, uses the WebView2 runtime already on every Win11 box. Cold start target under 400 ms.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Buildable from the VPS workflow\u003c/td>\n\u003ctd>The UI runs in a normal browser with a mocked Tauri layer, so Playwright screenshots verify every UI change on the VPS. Windows binaries build on GitHub Actions (\u003ccode>tauri-action\u003c/code>, \u003ccode>windows-latest\u003c/code>) into \u003ccode>kainevfx/notepad-2.0\u003c/code> releases.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Alternative considered: \u003cstrong>WinUI 3 / Windows App SDK (C#)\u003c/strong>. That is literally what Microsoft&#39;s Notepad is built on, so native fidelity is marginally higher. Against it: Markdown preview and a rich code editor still need WebView2 inside it, nothing can be built or previewed from the VPS, tray support needs a third-party lib, and the repo becomes Windows-only forever. Kept as a decision for Kaine, recommendation is Tauri.\u003c/p>\n\u003ch2>2. Feature map and phases\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Phase\u003c/th>\n\u003cth>Scope\u003c/th>\n\u003cth>Sub-plan\u003c/th>\n\u003cth>Est. (agent build time)\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>P0\u003c/td>\n\u003ctd>Repo scaffold, Tauri 2 app, CI build to MSI + NSIS, browser dev mode with Tauri mock\u003c/td>\n\u003ctd>01\u003c/td>\n\u003ctd>0.5 day\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1\u003c/td>\n\u003ctd>Notepad parity shell: title bar tabs, menus, status bar, find/replace, go to line, zoom, word wrap, font, encodings (UTF-8/16, ANSI, BOM), line endings (CRLF/LF/CR) preserved on save, session restore, all shortcuts\u003c/td>\n\u003ctd>01\u003c/td>\n\u003ctd>2 days\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2\u003c/td>\n\u003ctd>Vertical tabs, collapsible rail, Chrome-style groups with colours, nested subgroups, drag and drop\u003c/td>\n\u003ctd>02\u003c/td>\n\u003ctd>2 days\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P3\u003c/td>\n\u003ctd>Paper modes toolbar: Grid, Lines, Numbers, None, per-tab or global\u003c/td>\n\u003ctd>03\u003c/td>\n\u003ctd>0.5 day\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P4\u003c/td>\n\u003ctd>Markdown: highlighting, split preview, preview-only, scroll sync, the full GFM set\u003c/td>\n\u003ctd>04\u003c/td>\n\u003ctd>1.5 days\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P5\u003c/td>\n\u003ctd>Save model: autosave for untitled and quick notes, manual save for files, crash-safe writes, opt-in autosave for files\u003c/td>\n\u003ctd>05\u003c/td>\n\u003ctd>1 day\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P6\u003c/td>\n\u003ctd>Tray, close-to-tray button, Quick Note bubble, global hotkey\u003c/td>\n\u003ctd>06\u003c/td>\n\u003ctd>1 day\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P7\u003c/td>\n\u003ctd>Windows integration: default app for .txt/.md, &quot;Replace Notepad&quot; (IFEO), Open With entries, context menu, uninstall cleanup\u003c/td>\n\u003ctd>07\u003c/td>\n\u003ctd>1 day\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P8\u003c/td>\n\u003ctd>Polish, installer, auto-update (Tauri updater against GitHub Releases), optional code signing\u003c/td>\n\u003ctd>07\u003c/td>\n\u003ctd>0.5 day\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Total roughly 10 agent-days, run as one \u003ccode>claude-fable-5-1\u003c/code> build mission per 2 to 3 phases, each phase ending with screenshots and a green CI build Kaine can install.\u003c/p>\n\u003ch2>3. Save rules (the bit most likely to go wrong)\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Document kind\u003c/th>\n\u003cth>Default behaviour\u003c/th>\n\u003cth>Setting\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Quick Note (tray bubble)\u003c/td>\n\u003ctd>Autosaves 500 ms after typing stops, into the app&#39;s note store. Never asks.\u003c/td>\n\u003ctd>none\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>New untitled tab (Ctrl+N)\u003c/td>\n\u003ctd>Autosaves to the note store (like Win11 Notepad&#39;s session restore). Tab shows no dirty dot. &quot;Save as&quot; moves it to disk.\u003c/td>\n\u003ctd>none\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Existing file on disk\u003c/td>\n\u003ctd>\u003cstrong>Does not autosave.\u003c/strong> Dirty dot on the tab, Ctrl+S to write. On close: Save / Don&#39;t save / Cancel. Unsaved edits still survive a crash (kept in the recovery store, not the file).\u003c/td>\n\u003ctd>&quot;Autosave opened files&quot; off by default, per group override\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>All disk writes are atomic: write \u003ccode>file.tmp\u003c/code>, fsync, rename over the original, preserving encoding, BOM and line endings exactly as read. Opening a file never rewrites it.\u003c/p>\n\u003ch2>4. Windows integration: what is and is not possible\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Default app for .txt/.md.\u003c/strong> Since Windows 8, no app can silently set itself as default: the per-user choice is hash-protected and only the user can confirm it. The legitimate route (what Directory Opus, browsers and Notepad++ do) is: register ProgIDs and Capabilities, add the app to \u003ccode>RegisteredApplications\u003c/code>, then open \u003ccode>ms-settings:defaultapps?registeredAppUser=Notepad2\u003c/code> which lands on our app&#39;s page with a &quot;Set default&quot; button. One click from Kaine, once. The settings pane in our app shows the current state and a button that does all of this.\u003c/li>\n\u003cli>\u003cstrong>Replace Notepad.\u003c/strong> Image File Execution Options: \u003ccode>HKLM\\...\\Image File Execution Options\\notepad.exe\u003c/code> value \u003ccode>Debugger\u003c/code> = \u003ccode>&quot;&lt;install&gt;\\notepad2.exe&quot; --notepad-style-cmdline\u003c/code>. Every launch of \u003ccode>notepad.exe\u003c/code> (Run box, scripts, &quot;Edit&quot; verbs, other apps) then opens ours; the app strips the injected \u003ccode>notepad.exe\u003c/code> path from argv. Needs one UAC prompt (HKLM). Toggle off removes the key. This is the same mechanism Notepad++ and Notepad3 use.\u003c/li>\n\u003cli>\u003cstrong>Win11 caveat:\u003c/strong> Win11&#39;s Store Notepad also has an App Execution Alias. The toggle opens Settings &gt; Apps &gt; Advanced &gt; App execution aliases so Kaine can switch the Notepad alias off, and we verify both launch paths in P7 tests.\u003c/li>\n\u003c/ul>\n\u003ch2>5. Risks\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Risk\u003c/th>\n\u003cth>Mitigation\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Custom title bar loses Win11 Snap Layouts\u003c/td>\n\u003ctd>\u003ccode>tauri-plugin-decorum\u003c/code>; tested in P1 acceptance.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Name / icon trademark (&quot;Notepad&quot;, &quot;Notepad++&quot; in the mockups)\u003c/td>\n\u003ctd>Own name and icon, look-alike layout only. See decisions.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Unsigned installer triggers SmartScreen\u003c/td>\n\u003ctd>Fine for personal use; optional Azure Trusted Signing (paid) in P8.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Encoding round-trip bugs corrupting files\u003c/td>\n\u003ctd>Byte-exact round-trip test suite (UTF-8, UTF-8 BOM, UTF-16 LE/BE, Windows-1252, mixed line endings) gates every release.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Group tree drag and drop edge cases (dropping a group into its own child)\u003c/td>\n\u003ctd>Pure tree-ops module with unit tests, UI only calls it.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n"},{"file":"task-at-hand-summary.md","title":"Task at hand","html":"\u003ch1>Task at hand: Notepad 2.0\u003c/h1>\n\u003cp>\u003cem>Created 2026-09-27. Source: Kaine&#39;s project brief + 4 reference screenshots (\u003ccode>assets/reference/\u003c/code>).\u003c/em>\u003c/p>\n\u003ch2>The ask in one line\u003c/h2>\n\u003cp>A Windows text editor that looks and behaves exactly like Windows 11 Notepad, plus a set of power features, and that can fully replace Notepad as the default for \u003ccode>.txt\u003c/code> and \u003ccode>.md\u003c/code>.\u003c/p>\n\u003ch2>Non-negotiable: Notepad parity\u003c/h2>\n\u003cul>\n\u003cli>Same window chrome (Mica title bar, tab strip in the title bar, File / Edit / View menu row, status bar with Ln/Col, character count, zoom, line ending, encoding).\u003c/li>\n\u003cli>Same keyboard shortcuts (Ctrl+N/T/O/S/Shift+S/W/F/H/G/Z/Y, F5 time/date, Ctrl+Plus/Minus/0 zoom, etc.).\u003c/li>\n\u003cli>Same light/dark theme behaviour (follows Windows), same fonts (Consolas default, font picker in Settings).\u003c/li>\n\u003cli>Same session restore Win11 Notepad has (reopen with unsaved tabs intact).\u003c/li>\n\u003cli>With every extra feature switched off, a user should not be able to tell it apart from Notepad.\u003c/li>\n\u003c/ul>\n\u003ch2>Added features (from the brief)\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>#\u003c/th>\n\u003cth>Feature\u003c/th>\n\u003cth>Notes from brief and screenshots\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>F1\u003c/td>\n\u003ctd>Vertical tabs mode\u003c/td>\n\u003ctd>Toggle between top tab strip (Notepad default) and a left sidebar. Screenshot 4 also shows a collapsed rail with rotated group labels.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F2\u003c/td>\n\u003ctd>Chrome-style tab groups\u003c/td>\n\u003ctd>Named, colour-coded groups. Drag and drop notes between groups and to reorder. \u003cstrong>Nested subgroups\u003c/strong>. Click a group header to expand or collapse.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F3\u003c/td>\n\u003ctd>Close to tray + Quick Note bubble\u003c/td>\n\u003ctd>A &quot;close to tray&quot; button. From the tray icon, a slide-out mini window (1/8 to 1/4 of the screen, bottom-right) you just start typing in. Quick notes autosave.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F4\u003c/td>\n\u003ctd>Save rules\u003c/td>\n\u003ctd>Quick notes and new untitled notes autosave. Editing an existing file does NOT autosave by default: File &gt; Save as normal. Autosave for existing files is an opt-in setting.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F5\u003c/td>\n\u003ctd>Full Markdown\u003c/td>\n\u003ctd>Open any \u003ccode>.md\u003c/code> and render it correctly (CommonMark + GitHub flavoured). Edit with markdown highlighting, live split preview (screenshot 1), preview-only mode. No rendering errors.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F6\u003c/td>\n\u003ctd>Paper modes\u003c/td>\n\u003ctd>Floating toolbar with \u003cstrong>Grid\u003c/strong> (graph paper), \u003cstrong>Lines\u003c/strong> (writing paper), \u003cstrong>Numbers\u003c/strong> (code line numbers), \u003cstrong>None\u003c/strong> (plain Notepad). Screenshots 2 to 4.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F7\u003c/td>\n\u003ctd>Notepad replacement\u003c/td>\n\u003ctd>Option to make it launch whenever anything runs \u003ccode>notepad.exe\u003c/code>.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F8\u003c/td>\n\u003ctd>Default app for .txt / .md\u003c/td>\n\u003ctd>Settings button that registers it and sets it as the default opener for \u003ccode>.txt\u003c/code> and \u003ccode>.md\u003c/code>, like Directory Opus does for its own role.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2>Reading the screenshots\u003c/h2>\n\u003cul>\n\u003cli>\u003ccode>01-split-md-preview.jpg\u003c/code>: editor left, &quot;Markdown Preview&quot; pane right with a toggle in the title bar. Note the mock preview renders \u003ccode>**Business Strategy**\u003c/code> with literal asterisks inside a heading. That is exactly the &quot;syntax error&quot; class Kaine wants gone: we use a spec-compliant parser, not a hand-rolled one.\u003c/li>\n\u003cli>\u003ccode>02\u003c/code> / \u003ccode>03\u003c/code>: Lines and Numbers modes, vertical groups sidebar (Project Alpha blue, Development purple, Meeting Notes orange, Ideas green), Quick Note bubble bottom-right with a Save button.\u003c/li>\n\u003cli>\u003ccode>04\u003c/code>: Grid mode plus the collapsed-rail variant (group names rotated 90 degrees in a thin strip).\u003c/li>\n\u003cli>Status bar mentions &quot;Markdown system&quot;, \u003ccode>100%\u003c/code>, \u003ccode>Unix (LF)\u003c/code>, \u003ccode>UTF-8\u003c/code>: same fields as Notepad plus a language mode indicator.\u003c/li>\n\u003c/ul>\n\u003ch2>Out of scope (v1)\u003c/h2>\n\u003cul>\n\u003cli>Cloud sync, accounts, collaboration.\u003c/li>\n\u003cli>macOS / Linux builds (the stack allows them later).\u003c/li>\n\u003cli>Spell-check beyond what the OS web view gives.\u003c/li>\n\u003c/ul>\n"},{"file":"questions-approvals-and-decisions.md","title":"Decisions for Kaine","html":"\u003ch1>Questions, approvals and decisions\u003c/h1>\n\u003col>\n\u003cli>\u003cstrong>Stack.\u003c/strong> Build on \u003cstrong>Tauri 2 (recommended)\u003c/strong> or \u003cstrong>WinUI 3 / C#\u003c/strong>? Tauri can be built and screenshot-tested from the VPS and CI; WinUI is Microsoft&#39;s own toolkit but Windows-only to build and still needs WebView2 for Markdown.\u003c/li>\n\u003cli>\u003cstrong>Name and icon.\u003c/strong> The mockups say &quot;Notepad++ Advanced&quot;. Notepad++ is someone else&#39;s trademark, and Microsoft owns &quot;Notepad&quot; and its icon, and you&#39;ve had a cease-and-desist before. Pick: \u003cstrong>&quot;Notepad 2.0&quot; as a working title only\u003c/strong>, \u003cstrong>a new name (e.g. Leaf, Jot, Slate)\u003c/strong>, or \u003cstrong>a GodMode-branded name\u003c/strong>. The layout can look like Notepad; the name and icon have to be ours.\u003c/li>\n\u003cli>\u003cstrong>Quick Note Save button.\u003c/strong> Quick notes autosave, so the mock&#39;s Save button would do nothing. Make it \u003cstrong>&quot;Save as file...&quot;\u003c/strong> or \u003cstrong>remove it\u003c/strong>?\u003c/li>\n\u003cli>\u003cstrong>Close (X) behaviour.\u003c/strong> Should X \u003cstrong>quit like Notepad (tray via its own button)\u003c/strong> or \u003cstrong>go to tray by default\u003c/strong>?\u003c/li>\n\u003cli>\u003cstrong>Replace Notepad globally.\u003c/strong> Ship the IFEO \u003cstrong>&quot;Replace Notepad&quot; toggle\u003c/strong> (one admin prompt, affects every program that launches notepad.exe) or \u003cstrong>default-app registration only\u003c/strong>?\u003c/li>\n\u003cli>\u003cstrong>Code signing.\u003c/strong> Stay \u003cstrong>unsigned (SmartScreen warning once)\u003c/strong> or pay for \u003cstrong>Azure Trusted Signing\u003c/strong> (monthly fee, needs your ID verification)?\u003c/li>\n\u003cli>\u003cstrong>Extra file types.\u003c/strong> Register only \u003cstrong>.txt and .md\u003c/strong>, or also \u003cstrong>.log, .ini, .cfg, .json, .csv\u003c/strong>?\u003c/li>\n\u003cli>\u003cstrong>Build go-ahead.\u003c/strong> Queue the build as \u003cstrong>one long fable mission (P0 to P8)\u003c/strong> or \u003cstrong>phase by phase with screenshots between\u003c/strong>?\u003c/li>\n\u003c/ol>\n"},{"file":"sub-plan-breakdown-item-01.md","title":"01 Scaffold + parity","html":"\u003ch1>Sub-plan 01: scaffold and Notepad parity shell (P0 + P1)\u003c/h1>\n\u003ch2>P0 scaffold\u003c/h2>\n\u003cul>\n\u003cli>\u003ccode>npm create tauri-app\u003c/code> (Tauri 2, Vite, Preact + TypeScript), pnpm.\u003c/li>\n\u003cli>Plugins: \u003ccode>single-instance\u003c/code>, \u003ccode>fs\u003c/code>, \u003ccode>dialog\u003c/code>, \u003ccode>global-shortcut\u003c/code>, \u003ccode>window-state\u003c/code>, \u003ccode>updater\u003c/code>, \u003ccode>store\u003c/code>, \u003ccode>decorum\u003c/code>.\u003c/li>\n\u003cli>\u003ccode>src/platform/\u003c/code> interface (\u003ccode>openFile\u003c/code>, \u003ccode>saveFile\u003c/code>, \u003ccode>listRecent\u003c/code>, \u003ccode>tray\u003c/code>, \u003ccode>registry\u003c/code>) with two implementations: \u003ccode>tauri.ts\u003c/code> and \u003ccode>browser-mock.ts\u003c/code> (localStorage). The mock lets Playwright on the VPS screenshot every screen.\u003c/li>\n\u003cli>GitHub Actions: \u003ccode>ci.yml\u003c/code> (typecheck, vitest, Playwright screenshots on ubuntu) and \u003ccode>release.yml\u003c/code> (\u003ccode>tauri-action\u003c/code> on \u003ccode>windows-latest\u003c/code>, MSI + NSIS artefacts, draft release on tag).\u003c/li>\n\u003c/ul>\n\u003ch2>P1 parity checklist\u003c/h2>\n\u003cp>Window\u003c/p>\n\u003cul>\n\u003cli>Custom title bar: app icon, tab strip, \u003ccode>+\u003c/code> new tab, min / max / close with Snap Layouts flyout.\u003c/li>\n\u003cli>Mica backdrop, falls back to solid on Win10.\u003c/li>\n\u003cli>Window size, position and maximised state remembered.\u003c/li>\n\u003c/ul>\n\u003cp>Menu row (File, Edit, View) and settings gear, matching Notepad&#39;s items and order:\u003c/p>\n\u003cul>\n\u003cli>File: New tab, New window, Open, Recent, Save, Save as, Save all, Page setup, Print, Close tab, Close window, Exit.\u003c/li>\n\u003cli>Edit: Undo, Cut, Copy, Paste, Delete, Find, Find next/previous, Replace, Go to, Select all, Time/Date, Font.\u003c/li>\n\u003cli>View: Zoom, Status bar, Word wrap, plus our additions grouped under a separator (Tabs: Top / Left, Paper: Grid / Lines / Numbers / None, Markdown preview).\u003c/li>\n\u003c/ul>\n\u003cp>Editor\u003c/p>\n\u003cul>\n\u003cli>Consolas 11pt default, font picker, zoom 10% to 500% (Ctrl+wheel too).\u003c/li>\n\u003cli>Find/replace bar docked at top like Notepad (match case, wrap around, regex as an extra).\u003c/li>\n\u003cli>Encoding detection (BOM, UTF-8 validity check, fallback Windows-1252), line ending detection, both shown and changeable in the status bar.\u003c/li>\n\u003cli>Session restore: on reopen, every tab comes back with unsaved content, caret and scroll.\u003c/li>\n\u003c/ul>\n\u003cp>Status bar: \u003ccode>Ln x, Col y\u003c/code> | characters | language mode (Plain text / Markdown) | zoom | line ending | encoding.\u003c/p>\n\u003ch2>Done when\u003c/h2>\n\u003cp>Side by side screenshots against Win11 Notepad in light and dark match layout, spacing and typography, and the shortcut table in \u003ccode>verification-feature-test.md\u003c/code> passes.\u003c/p>\n"},{"file":"sub-plan-breakdown-item-02.md","title":"02 Vertical tabs + groups","html":"\u003ch1>Sub-plan 02: vertical tabs, groups, nested subgroups (P2)\u003c/h1>\n\u003ch2>Modes\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Top\u003c/strong> (default, pure Notepad). Groups still show as coloured chips in the tab strip, Chrome style: click chip to collapse the group&#39;s tabs.\u003c/li>\n\u003cli>\u003cstrong>Left\u003c/strong>: sidebar as in screenshots 1 to 3. Resizable 180 to 420 px, width remembered.\u003c/li>\n\u003cli>\u003cstrong>Rail\u003c/strong>: sidebar collapsed via the \u003ccode>&lt;\u003c/code> button to a thin strip with group names rotated 90 degrees (screenshot 4). Hover or click expands it as an overlay.\u003c/li>\n\u003cli>Toggle: View &gt; Tabs, a title-bar button, and \u003ccode>Ctrl+Shift+,\u003c/code>.\u003c/li>\n\u003c/ul>\n\u003ch2>Data model (\u003ccode>workspace.json\u003c/code>)\u003c/h2>\n\u003cpre>\u003ccode class=\"language-ts\">type Color = &#39;grey&#39;|&#39;blue&#39;|&#39;red&#39;|&#39;yellow&#39;|&#39;green&#39;|&#39;pink&#39;|&#39;purple&#39;|&#39;cyan&#39;|&#39;orange&#39;; // Chrome&#39;s 9\ninterface GroupNode { id: string; kind: &#39;group&#39;; name: string; color: Color; collapsed: boolean; children: TreeNode[] }\ninterface NoteNode  { id: string; kind: &#39;note&#39;; title: string; source: { type: &#39;file&#39;; path: string } | { type: &#39;store&#39;; storeId: string }; pinned?: boolean }\ntype TreeNode = GroupNode | NoteNode;\ninterface Workspace { version: 1; root: TreeNode[]; activeId: string | null; tabsMode: &#39;top&#39;|&#39;left&#39;|&#39;rail&#39;; sidebarWidth: number }\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>Nesting depth capped at 4 levels (keeps the sidebar readable). Subgroups inherit the parent colour as a left border tint unless they have their own.\u003c/li>\n\u003cli>An open tab is simply a NoteNode. Closing a tab removes it from the tree unless the group is &quot;pinned&quot; (option), so groups can act as saved workspaces.\u003c/li>\n\u003c/ul>\n\u003ch2>Interactions\u003c/h2>\n\u003cul>\n\u003cli>Drag a note: reorder, drop onto a group header to add, drop between groups to ungroup. Drag a group: reorder or nest into another group. Drop indicator line plus a highlighted target header.\u003c/li>\n\u003cli>Library: \u003ccode>@atlaskit/pragmatic-drag-and-drop\u003c/code> + its tree-item hitbox helper (handles &quot;before / after / make child&quot; zones, keyboard accessible).\u003c/li>\n\u003cli>All moves go through \u003ccode>tree-ops.ts\u003c/code> (pure functions: \u003ccode>move\u003c/code>, \u003ccode>insert\u003c/code>, \u003ccode>remove\u003c/code>, \u003ccode>wouldCreateCycle\u003c/code>) with vitest coverage, including dropping a group into its own descendant (rejected).\u003c/li>\n\u003cli>Right-click note: Add to new group, Move to group &gt;, Remove from group, Close, Reveal in Explorer, Copy path.\u003c/li>\n\u003cli>Right-click group: Rename, Colour (9 swatches), New subgroup, Collapse all inside, Ungroup, Close group, Save group as workspace.\u003c/li>\n\u003cli>Click a group header or its chevron: expand/collapse. Alt+click: collapse/expand all siblings.\u003c/li>\n\u003cli>Keyboard: Ctrl+Tab / Ctrl+Shift+Tab walks visible tabs in tree order, \u003ccode>Ctrl+Shift+G\u003c/code> new group from current tab.\u003c/li>\n\u003cli>The \u003ccode>.md\u003c/code> badge in screenshot 1 shows per-note file type.\u003c/li>\n\u003c/ul>\n"},{"file":"sub-plan-breakdown-item-03.md","title":"03 Paper modes","html":"\u003ch1>Sub-plan 03: paper modes (P3)\u003c/h1>\n\u003cp>Floating segmented toolbar (screenshots 2 to 4): \u003cstrong>Grid\u003c/strong>, \u003cstrong>Lines\u003c/strong>, \u003cstrong>Numbers\u003c/strong>, \u003cstrong>None\u003c/strong>. Appears from View &gt; Paper and from a title-bar button; auto-hides after selection, like the screenshot&#39;s popover.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Mode\u003c/th>\n\u003cth>Rendering\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>None\u003c/td>\n\u003ctd>Plain Notepad canvas.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Numbers\u003c/td>\n\u003ctd>CodeMirror \u003ccode>lineNumbers()\u003c/code> gutter, current line bold (screenshot 3). Numbers count logical lines, so wrapped lines leave a gap (as in the mock).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Lines\u003c/td>\n\u003ctd>Ruled writing paper: \u003ccode>repeating-linear-gradient\u003c/code> on the content layer with the pitch bound to the editor&#39;s \u003ccode>--line-height\u003c/code>, so rules sit under every visual line including wrapped ones. Optional red margin rule. Rules follow zoom.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Grid\u003c/td>\n\u003ctd>Graph paper: two gradients, minor cell = one line height, major line every 5 cells.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cul>\n\u003cli>Paper can combine with Numbers (checkbox &quot;Also show line numbers&quot;) because Kaine&#39;s screenshots show Grid and Lines with numbers visible.\u003c/li>\n\u003cli>Default is global; &quot;Remember per tab&quot; setting stores the choice on the NoteNode.\u003c/li>\n\u003cli>Colours derive from the theme: 6 to 8 percent contrast rules in dark, faint blue rules in light (paper feel).\u003c/li>\n\u003cli>Printing respects the chosen paper (Page setup checkbox).\u003c/li>\n\u003c/ul>\n"},{"file":"sub-plan-breakdown-item-04.md","title":"04 Markdown","html":"\u003ch1>Sub-plan 04: Markdown, read and edit without errors (P4)\u003c/h1>\n\u003ch2>Pipeline\u003c/h2>\n\u003cp>\u003ccode>unified\u003c/code> → \u003ccode>remark-parse\u003c/code> (micromark, CommonMark 0.31 compliant) → \u003ccode>remark-gfm\u003c/code> (tables, task lists, strikethrough, autolinks, footnotes) → \u003ccode>remark-frontmatter\u003c/code> → \u003ccode>remark-math\u003c/code> → \u003ccode>remark-rehype\u003c/code> (\u003ccode>allowDangerousHtml\u003c/code>) → \u003ccode>rehype-raw\u003c/code> → \u003ccode>rehype-sanitize\u003c/code> (no scripts, no event handlers) → \u003ccode>rehype-katex\u003c/code> → Shiki highlighter (lazy, VS Code grammars) → Mermaid blocks rendered client side on demand → \u003ccode>rehype-slug\u003c/code> + heading anchors.\u003c/p>\n\u003cp>Why this and not a hand-rolled or \u003ccode>marked\u003c/code>-style parser: the mock&#39;s preview shows \u003ccode>**bold**\u003c/code> inside a heading rendered with literal asterisks. micromark passes the full CommonMark and GFM spec test suites, which is the only honest meaning of &quot;no syntax errors&quot;. We vendor the spec tests into our own suite.\u003c/p>\n\u003ch2>Views (toggle in title bar, \u003ccode>Ctrl+Shift+V\u003c/code>, per tab)\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>Edit\u003c/strong> with Markdown syntax highlighting (CodeMirror \u003ccode>lang-markdown\u003c/code> + nested code-fence languages), headings slightly larger, \u003ccode>**\u003c/code>/\u003ccode>_\u003c/code> markers dimmed.\u003c/li>\n\u003cli>\u003cstrong>Split\u003c/strong>: editor left, preview right (screenshot 1), draggable divider, scroll sync by source line mapping (\u003ccode>data-line\u003c/code> on block elements).\u003c/li>\n\u003cli>\u003cstrong>Preview\u003c/strong> only, read mode, links clickable (Ctrl+click in edit mode).\u003c/li>\n\u003c/ol>\n\u003ch2>Editing helpers\u003c/h2>\n\u003cul>\n\u003cli>Ctrl+B / Ctrl+I / Ctrl+K (bold, italic, link), auto-continue lists and task items on Enter, Tab / Shift+Tab indents list items, table auto-align on Tab inside a table, paste an image saves it next to the file into \u003ccode>./assets/\u003c/code> and inserts the link (setting).\u003c/li>\n\u003cli>Outline pane (headings) optional in the sidebar under the groups.\u003c/li>\n\u003c/ul>\n\u003ch2>Rules that protect files\u003c/h2>\n\u003cul>\n\u003cli>The preview never writes back. The source text is the only truth, so opening and saving a \u003ccode>.md\u003c/code> changes nothing you did not type.\u003c/li>\n\u003cli>Local images and relative links resolve against the file&#39;s folder via Tauri&#39;s asset protocol, scoped to that folder.\u003c/li>\n\u003cli>Remote images load (setting to block them).\u003c/li>\n\u003cli>Files over 5 MB open in Edit mode with preview on demand.\u003c/li>\n\u003c/ul>\n\u003ch2>Plain \u003ccode>.txt\u003c/code>\u003c/h2>\n\u003cp>Markdown mode is off for \u003ccode>.txt\u003c/code> by default; status bar language picker switches it on.\u003c/p>\n"},{"file":"sub-plan-breakdown-item-05.md","title":"05 Save model","html":"\u003ch1>Sub-plan 05: save model and autosave (P5)\u003c/h1>\n\u003ch2>Stores (under \u003ccode>%APPDATA%\\Notepad2\\\u003c/code>)\u003c/h2>\n\u003cul>\n\u003cli>\u003ccode>notes\\&lt;id&gt;.md\u003c/code> untitled notes and quick notes (plain files, readable without the app).\u003c/li>\n\u003cli>\u003ccode>recovery\\&lt;id&gt;.json\u003c/code> unsaved edits to on-disk files: \u003ccode>{ path, baseMtime, baseHash, text, encoding, eol }\u003c/code>.\u003c/li>\n\u003cli>\u003ccode>workspace.json\u003c/code>, \u003ccode>settings.json\u003c/code>, \u003ccode>session.json\u003c/code>.\u003c/li>\n\u003c/ul>\n\u003ch2>Behaviour\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Event\u003c/th>\n\u003cth>Untitled / Quick note\u003c/th>\n\u003cth>File on disk (default)\u003c/th>\n\u003cth>File on disk (autosave on)\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Typing\u003c/td>\n\u003ctd>debounce 500 ms, write to \u003ccode>notes\\\u003c/code>\u003c/td>\n\u003ctd>debounce 1 s, write to \u003ccode>recovery\\\u003c/code> only\u003c/td>\n\u003ctd>debounce 1 s, atomic write to the file\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Tab dirty dot\u003c/td>\n\u003ctd>never\u003c/td>\n\u003ctd>yes until Ctrl+S\u003c/td>\n\u003ctd>never\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Close tab\u003c/td>\n\u003ctd>kept in store, tab closes (can reopen from &quot;Notes&quot; list)\u003c/td>\n\u003ctd>Save / Don&#39;t save / Cancel\u003c/td>\n\u003ctd>closes\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>App crash / power cut\u003c/td>\n\u003ctd>nothing lost\u003c/td>\n\u003ctd>recovery offers the edits on next start\u003c/td>\n\u003ctd>at most 1 s lost\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Save as\u003c/td>\n\u003ctd>moves from store to disk, becomes a &quot;file&quot; doc\u003c/td>\n\u003ctd>normal\u003c/td>\n\u003ctd>normal\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2>External changes\u003c/h2>\n\u003cp>File watcher (\u003ccode>notify\u003c/code> crate). If a clean file changes on disk, reload silently. If dirty, yellow bar: &quot;Changed on disk: Reload / Keep mine / Compare&quot;.\u003c/p>\n\u003ch2>Atomic write\u003c/h2>\n\u003cp>Write \u003ccode>&lt;name&gt;.~n2tmp\u003c/code> in the same folder, flush, \u003ccode>ReplaceFileW\u003c/code> (keeps ACLs, timestamps of creation, alternate streams) with rename fallback. Read-only files prompt to Save as.\u003c/p>\n\u003ch2>Settings\u003c/h2>\n\u003cul>\n\u003cli>Autosave opened files: off (global), overridable per group (&quot;Autosave everything in this group&quot;).\u003c/li>\n\u003cli>Autosave delay: 0.5 to 10 s.\u003c/li>\n\u003cli>Keep untitled notes for: forever / 30 days after close / delete on close.\u003c/li>\n\u003c/ul>\n"},{"file":"sub-plan-breakdown-item-06.md","title":"06 Tray + Quick Note","html":"\u003ch1>Sub-plan 06: tray icon and Quick Note bubble (P6)\u003c/h1>\n\u003ch2>Close to tray\u003c/h2>\n\u003cul>\n\u003cli>A title-bar button (down-arrow-into-tray icon) left of minimise, plus setting &quot;Close button (X) sends to tray instead of quitting&quot;. Tray menu: Open Notepad 2.0, New Quick Note, Recent quick notes &gt;, Settings, Quit.\u003c/li>\n\u003cli>Single-instance: launching the exe again (or double-clicking a file) focuses the running window and opens the file in a new tab.\u003c/li>\n\u003cli>&quot;Start with Windows (in tray)&quot; setting via the Run key.\u003c/li>\n\u003c/ul>\n\u003ch2>Quick Note bubble (screenshots bottom-right)\u003c/h2>\n\u003cul>\n\u003cli>Separate frameless, always-on-top Tauri window, rounded corners, Mica/Acrylic backdrop, shadow.\u003c/li>\n\u003cli>Opens on: left-click tray icon, global hotkey (default \u003ccode>Win+Alt+N\u003c/code>, rebindable), or tray menu.\u003c/li>\n\u003cli>Anchors bottom-right above the taskbar (reads the work area of the monitor with the tray; handles top/left taskbars), slides up 180 ms.\u003c/li>\n\u003cli>Size presets: \u003cstrong>1/8 screen\u003c/strong> (default, ~ 480 x 540 on 1440p) or \u003cstrong>1/4 screen\u003c/strong>, plus free resize remembered.\u003c/li>\n\u003cli>Header: icon, &quot;Quick Note&quot;, \u003ccode>...\u003c/code> menu (Open in main window, Move to group &gt;, New quick note, Pin on top, Size), close.\u003c/li>\n\u003cli>Body: title line + text area, focus lands in the text area immediately so you just type. Markdown highlighting on.\u003c/li>\n\u003cli>Autosaves continuously (sub-plan 05). The Save button in the mock becomes &quot;Save as file...&quot; since saving is automatic; confirm with Kaine.\u003c/li>\n\u003cli>Esc or clicking elsewhere hides it (setting &quot;Hide on focus loss&quot;). Contents persist; next open resumes the same note, \u003ccode>Ctrl+N\u003c/code> inside starts a new one.\u003c/li>\n\u003cli>Every quick note lands in a built-in &quot;Quick Notes&quot; group in the main window&#39;s sidebar, newest first.\u003c/li>\n\u003c/ul>\n"},{"file":"sub-plan-breakdown-item-07.md","title":"07 Windows integration","html":"\u003ch1>Sub-plan 07: Windows integration, installer, updates (P7 + P8)\u003c/h1>\n\u003ch2>Settings &gt; Default apps page (Directory Opus style)\u003c/h2>\n\u003cp>Shows live state read from the registry, each with a button:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Row\u003c/th>\n\u003cth>State shown\u003c/th>\n\u003cth>Button does\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Default for \u003ccode>.txt\u003c/code>\u003c/td>\n\u003ctd>Yes / No (reads \u003ccode>UserChoice\\ProgId\u003c/code>)\u003c/td>\n\u003ctd>Registers, then opens \u003ccode>ms-settings:defaultapps?registeredAppUser=Notepad2\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Default for \u003ccode>.md\u003c/code> / \u003ccode>.markdown\u003c/code>\u003c/td>\n\u003ctd>Yes / No\u003c/td>\n\u003ctd>same\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Replace Notepad (\u003ccode>notepad.exe\u003c/code> launches us)\u003c/td>\n\u003ctd>On / Off\u003c/td>\n\u003ctd>Elevated helper writes or deletes the IFEO key (one UAC prompt)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Windows Notepad app alias\u003c/td>\n\u003ctd>On / Off\u003c/td>\n\u003ctd>Opens \u003ccode>ms-settings:advanced-apps\u003c/code> (App execution aliases)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>&quot;Edit with Notepad 2.0&quot; in right-click menu\u003c/td>\n\u003ctd>On / Off\u003c/td>\n\u003ctd>Writes \u003ccode>HKCU\\Software\\Classes\\*\\shell\\Notepad2\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2>Registry written (all HKCU except IFEO)\u003c/h2>\n\u003cpre>\u003ccode>HKCU\\Software\\Classes\\Notepad2.txt\\shell\\open\\command  = &quot;&lt;exe&gt;&quot; &quot;%1&quot;\nHKCU\\Software\\Classes\\Notepad2.md\\shell\\open\\command   = &quot;&lt;exe&gt;&quot; &quot;%1&quot;\nHKCU\\Software\\Classes\\.txt\\OpenWithProgids   Notepad2.txt\nHKCU\\Software\\Classes\\.md\\OpenWithProgids    Notepad2.md\nHKCU\\Software\\Notepad2\\Capabilities  ApplicationName, ApplicationDescription\nHKCU\\Software\\Notepad2\\Capabilities\\FileAssociations  .txt=Notepad2.txt  .md=Notepad2.md  .markdown=Notepad2.md  .log .ini .cfg .json (optional)\nHKCU\\Software\\RegisteredApplications  Notepad2 = Software\\Notepad2\\Capabilities\nHKLM\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Image File Execution Options\\notepad.exe\n     Debugger = &quot;&lt;exe&gt;&quot; --notepad-style-cmdline\n\u003c/code>\u003c/pre>\n\u003cp>After writing: \u003ccode>SHChangeNotify(SHCNE_ASSOCCHANGED)\u003c/code>.\u003c/p>\n\u003ch2>Why there is always one click\u003c/h2>\n\u003cp>Windows protects \u003ccode>UserChoice\u003c/code> with a hash tied to the user and machine. Tools that forge it (SetUserFTA style) break on updates and get flagged by Defender. We use the supported route: register, then deep-link Kaine to our app&#39;s page in Default apps where he clicks &quot;Set default&quot;. The page in our settings then flips to &quot;Yes&quot;.\u003c/p>\n\u003ch2>Notepad-style command line\u003c/h2>\n\u003cp>When launched via IFEO, argv is \u003ccode>&lt;our exe&gt; --notepad-style-cmdline C:\\Windows\\System32\\notepad.exe [/A|/W|/P] [file]\u003c/code>. Parser drops the notepad path, honours \u003ccode>/P\u003c/code> (print), opens the file. Covered by unit tests with every shape we have seen (quoted, unquoted with spaces, no file).\u003c/p>\n\u003ch2>Installer and updates\u003c/h2>\n\u003cul>\n\u003cli>NSIS per-user installer (no admin needed except the IFEO toggle), MSI for completeness.\u003c/li>\n\u003cli>Uninstall removes every key above, including IFEO, and restores nothing it did not own.\u003c/li>\n\u003cli>Tauri updater against GitHub Releases of \u003ccode>kainevfx/notepad-2.0\u003c/code>, signed with a Tauri update key (stored in the vault, never in the repo).\u003c/li>\n\u003cli>Code signing optional: without it SmartScreen shows &quot;unrecognised app&quot; once. Azure Trusted Signing is the cheapest real option (paid, Kaine decides).\u003c/li>\n\u003c/ul>\n"},{"file":"current-and-existing-audit.md","title":"Existing audit","html":"\u003ch1>Current and existing audit\u003c/h1>\n\u003cp>\u003cem>2026-09-27\u003c/em>\u003c/p>\n\u003ch2>What exists in the project\u003c/h2>\n\u003cul>\n\u003cli>Dev path \u003ccode>/srv/claudette-data/uploads/projects/f4b495f3-.../\u003c/code> was empty before this plan.\u003c/li>\n\u003cli>GitHub repo set on the project: \u003ccode>https://github.com/kainevfx/notepad-2.0.git\u003c/code> (not yet checked for contents; first build mission clones or initialises it).\u003c/li>\n\u003cli>4 reference screenshots, now copied to \u003ccode>assets/reference/\u003c/code>.\u003c/li>\n\u003c/ul>\n\u003ch2>What we are replacing: Windows 11 Notepad (2024 to 2026 builds)\u003c/h2>\n\u003cp>Has: tabs in the title bar, session restore of unsaved tabs, dark mode, Mica, find/replace, spell check, word wrap, zoom, status bar, basic Markdown formatting toggle (recent Insider builds), Copilot &quot;Rewrite&quot; button, character count.\nMissing (our additions): vertical tabs, groups, nesting, colours, paper modes, full GFM preview with tables/maths/diagrams, tray quick notes, per-document autosave rules.\nKeep out: Copilot/AI buttons and sign-in prompts. Parity means the core editor, not the upsell.\u003c/p>\n\u003ch2>Adjacent tools and what we take from each\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Tool\u003c/th>\n\u003cth>Useful idea\u003c/th>\n\u003cth>Not copying\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Notepad++\u003c/td>\n\u003ctd>IFEO &quot;replace Notepad&quot; mechanism, \u003ccode>-notepadStyleCmdline\u003c/code> handling\u003c/td>\n\u003ctd>Its dated Win32 UI\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Notepad3\u003c/td>\n\u003ctd>Same IFEO approach, tiny footprint\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Chrome / Edge\u003c/td>\n\u003ctd>Tab groups: colour palette of 9, collapse, drag into group, name chips\u003c/td>\n\u003ctd>Edge&#39;s vertical tabs only have one level; we do nested\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Obsidian / Typora\u003c/td>\n\u003ctd>Split preview, GFM completeness\u003c/td>\n\u003ctd>Vault model, proprietary rendering quirks\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Directory Opus\u003c/td>\n\u003ctd>Settings page that shows &quot;is default: yes/no&quot; and fixes it with one button\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Microsoft PowerToys / Sticky Notes\u003c/td>\n\u003ctd>Tray-anchored mini window pattern\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2>Conflicts\u003c/h2>\n\u003cul>\n\u003cli>None with Claudette OS. This is a standalone Windows app. Nothing touches \u003ccode>src/\u003c/code>, \u003ccode>web/\u003c/code> or services.\u003c/li>\n\u003c/ul>\n"},{"file":"file-structure-logic-integration.md","title":"File structure","html":"\u003ch1>File structure, logic and integration\u003c/h1>\n\u003ch2>Repo (\u003ccode>kainevfx/notepad-2.0\u003c/code>, working copy at the project dev path under \u003ccode>app/\u003c/code>)\u003c/h2>\n\u003cpre>\u003ccode>app/\n  package.json  pnpm-lock.yaml  vite.config.ts  tsconfig.json\n  src/\n    main.tsx                 app entry (main window)\n    quicknote.tsx            entry for the Quick Note window\n    platform/                tauri.ts | browser-mock.ts | index.ts (interface)\n    state/                   workspace store, settings store, session\n    tree/tree-ops.ts         pure group-tree operations (+ tree-ops.test.ts)\n    editor/                  CodeMirror setup, paper.ts, markdown-lang.ts, keymap.ts\n    markdown/pipeline.ts     unified/remark/rehype chain (+ spec tests)\n    ui/                      TitleBar, TabStrip, Sidebar, GroupHeader, StatusBar, MenuBar, FindBar, PaperToolbar, Preview, Settings/*\n    styles/fluent.css        Notepad / Fluent 2 tokens, light + dark\n  src-tauri/\n    tauri.conf.json          windows: main + quicknote, fileAssociations, tray, updater\n    src/main.rs              setup, single-instance, argv parsing (notepad-style)\n    src/files.rs             encoding detect, atomic save, watcher\n    src/registry.rs          default-app registration, IFEO toggle (elevated helper), context menu\n    src/tray.rs              tray icon, menu, bubble positioning\n  e2e/                       Playwright specs + screenshot baselines\n  .github/workflows/         ci.yml, release.yml\nassets/reference/            Kaine&#39;s 4 mockups\nplans/2026-09-27-notepad-2/  this document set\n\u003c/code>\u003c/pre>\n\u003ch2>Runtime data (\u003ccode>%APPDATA%\\Notepad2\\\u003c/code>)\u003c/h2>\n\u003cp>\u003ccode>settings.json\u003c/code>, \u003ccode>workspace.json\u003c/code> (group tree), \u003ccode>session.json\u003c/code> (open tabs, caret, scroll), \u003ccode>notes\\*.md\u003c/code>, \u003ccode>recovery\\*.json\u003c/code>, \u003ccode>logs\\\u003c/code>.\u003c/p>\n\u003ch2>Integration points\u003c/h2>\n\u003cul>\n\u003cli>Windows Shell: ProgIDs, Capabilities, RegisteredApplications, IFEO, context-menu verb (sub-plan 07).\u003c/li>\n\u003cli>WebView2 runtime (preinstalled on Win11; installer bootstraps it on Win10).\u003c/li>\n\u003cli>GitHub Releases for installers and the updater feed.\u003c/li>\n\u003cli>Claudette OS: none at runtime. Build missions only.\u003c/li>\n\u003c/ul>\n"},{"file":"verification-feature-test.md","title":"Verification","html":"\u003ch1>Verification and feature tests\u003c/h1>\n\u003cp>Automated (CI, every push): \u003ccode>pnpm typecheck\u003c/code>, \u003ccode>pnpm test\u003c/code> (vitest), \u003ccode>pnpm e2e\u003c/code> (Playwright against the browser build with the Tauri mock, screenshot diffing), \u003ccode>cargo test\u003c/code> for the Rust side.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Feature\u003c/th>\n\u003cth>Test\u003c/th>\n\u003cth>Pass condition\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Parity\u003c/td>\n\u003ctd>Screenshot diff vs. reference Notepad captures, light + dark\u003c/td>\n\u003ctd>Layout within 2 px, same fonts\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Shortcuts\u003c/td>\n\u003ctd>Playwright walks the full shortcut table\u003c/td>\n\u003ctd>Every action fires\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Encoding round-trip\u003c/td>\n\u003ctd>Open + save untouched: UTF-8, UTF-8 BOM, UTF-16 LE/BE, 1252, CRLF / LF / CR / mixed\u003c/td>\n\u003ctd>Output bytes identical to input\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Big file\u003c/td>\n\u003ctd>50 MB log\u003c/td>\n\u003ctd>Opens under 2 s, typing latency under 16 ms\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Tabs modes\u003c/td>\n\u003ctd>Toggle Top / Left / Rail\u003c/td>\n\u003ctd>State persists across restart\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Groups\u003c/td>\n\u003ctd>Create, colour, nest 4 deep, drag note in/out, drag group into sibling, attempt into own child\u003c/td>\n\u003ctd>Tree correct, cycle rejected, persists\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Paper\u003c/td>\n\u003ctd>Each mode at 50%, 100%, 300% zoom, wrap on\u003c/td>\n\u003ctd>Rules align to lines at every zoom\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Markdown\u003c/td>\n\u003ctd>CommonMark 0.31 + GFM spec suites through our pipeline\u003c/td>\n\u003ctd>100% pass\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Markdown files\u003c/td>\n\u003ctd>Open README-style docs with tables, footnotes, maths, Mermaid, HTML, front matter\u003c/td>\n\u003ctd>Renders, saving unchanged file is byte-identical\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Save model\u003c/td>\n\u003ctd>Kill the process mid-typing in each doc kind\u003c/td>\n\u003ctd>Untitled/quick: nothing lost. File: recovery prompt, file on disk untouched\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>External change\u003c/td>\n\u003ctd>Edit file in another app while clean / dirty\u003c/td>\n\u003ctd>Silent reload / yellow bar\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Tray\u003c/td>\n\u003ctd>Close to tray, hotkey, click tray\u003c/td>\n\u003ctd>Bubble opens anchored above tray on each monitor/taskbar side, focus in text\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Quick note autosave\u003c/td>\n\u003ctd>Type, wait 1 s, kill process\u003c/td>\n\u003ctd>Text in \u003ccode>notes\\\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Default apps\u003c/td>\n\u003ctd>Run the Settings flow on a clean VM\u003c/td>\n\u003ctd>Explorer double-click opens ours\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Replace Notepad\u003c/td>\n\u003ctd>Win+R \u003ccode>notepad file.txt\u003c/code>, \u003ccode>start notepad\u003c/code>, another app&#39;s &quot;Edit&quot; verb\u003c/td>\n\u003ctd>All open ours with the file; toggle off restores Notepad\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Uninstall\u003c/td>\n\u003ctd>Uninstall on the VM\u003c/td>\n\u003ctd>No leftover keys, Notepad works normally\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Manual on the Home PC: the Kaine checklist in \u003ccode>kaine-action-items-to-complete.md\u003c/code>.\u003c/p>\n"},{"file":"kaine-action-items-to-complete.md","title":"Kaine action items","html":"\u003ch1>Kaine action items\u003c/h1>\n\u003ch2>Now\u003c/h2>\n\u003cul>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Decisions still open in \u003ccode>questions-approvals-and-decisions.md\u003c/code>: name/icon (2), code signing (6). The build went ahead on the recommended defaults for the rest (Tauri; Quick Note button = &quot;Save as file...&quot;; X goes to tray, switchable in Settings; Replace Notepad shipped as an opt-in toggle; all 8 file types offered).\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Get a Windows build, either way:\u003cul>\n\u003cli>\u003cstrong>GitHub:\u003c/strong> create \u003ccode>kainevfx/notepad-2.0\u003c/code>, push the \u003ccode>app/\u003c/code> folder, open Actions &gt; build-windows &gt; download \u003ccode>notepad2-windows\u003c/code>.\u003c/li>\n\u003cli>\u003cstrong>Home PC:\u003c/strong> copy \u003ccode>app/\u003c/code> over, then \u003ccode>npm ci\u003c/code> and \u003ccode>npx tauri build\u003c/code> (needs Node 24 + Rust from rustup.rs).\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003ch2>First run on the Home PC\u003c/h2>\n\u003cul>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Install the NSIS \u003ccode>.exe\u003c/code> (per-user, no admin). SmartScreen will warn once: More info &gt; Run anyway (unsigned).\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Open it next to Windows Notepad in light and dark; flag anything that looks different.\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Close to tray, click the tray icon, press Win+Alt+N: the Quick Note bubble should appear above the tray and autosave.\u003c/li>\n\u003c/ul>\n\u003ch2>Make it the default\u003c/h2>\n\u003cul>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Settings &gt; Windows integration &gt; &quot;Use Notepad 2.0 instead of Windows Notepad&quot; (one UAC prompt), then click \u003cstrong>Set default\u003c/strong> on the Windows page it opens.\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Open App execution aliases from the same page and turn off the Notepad alias.\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> Test: Win+R \u003ccode>notepad\u003c/code> opens ours. Double-click a \u003ccode>.md\u003c/code> in Explorer opens ours in split preview.\u003c/li>\n\u003cli>\u003cinput disabled=\"\" type=\"checkbox\"> To undo: flip the switch off, or uninstall (removes every key, including the notepad.exe redirect).\u003c/li>\n\u003c/ul>\n\u003cp>Nothing here spends money unless you choose code signing.\u003c/p>\n"},{"file":"agent-suggested-improvements.md","title":"Suggested improvements","html":"\u003ch1>Agent-suggested improvements\u003c/h1>\n\u003cp>Not in the brief. Cheap to add once the core is built; ranked by value for the effort.\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Command palette (Ctrl+Shift+P).\u003c/strong> Every action, every open note and every group, fuzzy searched. Makes a deep group tree fast to use.\u003c/li>\n\u003cli>\u003cstrong>Search across all notes\u003c/strong> (Ctrl+Shift+F) including closed quick notes in the store.\u003c/li>\n\u003cli>\u003cstrong>Group = folder link.\u003c/strong> Point a group at a folder (e.g. a project&#39;s \u003ccode>docs/\u003c/code>) and it lists the \u003ccode>.md\u003c/code>/\u003ccode>.txt\u003c/code> files live. Good for Kaine&#39;s Claudette plan folders.\u003c/li>\n\u003cli>\u003cstrong>Quick Note to group routing.\u003c/strong> A \u003ccode>#tag\u003c/code> on the first line files the quick note straight into the matching group.\u003c/li>\n\u003cli>\u003cstrong>Copy as rich text / HTML\u003c/strong> from Markdown preview, for pasting into emails and Google Docs.\u003c/li>\n\u003cli>\u003cstrong>Export to PDF\u003c/strong> from preview with the chosen paper background.\u003c/li>\n\u003cli>\u003cstrong>Diff against saved\u003c/strong> (the &quot;Compare&quot; button in the external-change bar also works on demand).\u003c/li>\n\u003cli>\u003cstrong>Typewriter / focus mode\u003c/strong> for writing: current line centred, others dimmed.\u003c/li>\n\u003cli>\u003cstrong>Per-group colour on the taskbar thumbnail\u003c/strong>, so a pinned workspace is recognisable.\u003c/li>\n\u003cli>\u003cstrong>Portable mode\u003c/strong> (settings next to the exe) for a USB stick on tour laptops.\u003c/li>\n\u003c/ol>\n"},{"file":"dossier-feature-development-memory-record.md","title":"Dossier","html":"\u003ch1>Dossier: Notepad 2.0 development record\u003c/h1>\n\u003cp>\u003cem>Append-only. Newest entries at the bottom.\u003c/em>\u003c/p>\n\u003ch2>2026-09-27 planning (developer agent)\u003c/h2>\n\u003cul>\n\u003cli>Read the project brief and the 4 reference mockups (vertical coloured groups, collapsed rail, Grid/Lines/Numbers/None toolbar, split Markdown preview, Quick Note bubble).\u003c/li>\n\u003cli>Copied mockups to \u003ccode>assets/reference/\u003c/code>.\u003c/li>\n\u003cli>Chose Tauri 2 + Preact + CodeMirror 6 + unified/remark as the recommended stack (WinUI 3 left as the alternative for Kaine to decide).\u003c/li>\n\u003cli>Defined save rules: autosave for untitled and quick notes, manual save for disk files with crash recovery, opt-in autosave for files.\u003c/li>\n\u003cli>Documented the supported default-app route (register + Settings deep link, one user click) and the IFEO route for replacing notepad.exe.\u003c/li>\n\u003cli>Flagged a trademark issue: mockups use &quot;Notepad++&quot;; the app needs its own name and icon.\u003c/li>\n\u003cli>Wrote the full plan set in \u003ccode>plans/2026-09-27-notepad-2/\u003c/code>. No code written, nothing built, nothing installed.\u003c/li>\n\u003cli>Project status set to \u003ccode>planned\u003c/code>.\u003c/li>\n\u003c/ul>\n\u003ch2>2026-09-27 10:50-11:16 frontend build (developer agent, earlier session)\u003c/h2>\n\u003cul>\n\u003cli>Built the full UI in \u003ccode>app/src/\u003c/code>: Notepad-parity chrome, top/left/rail tab modes, nested colour groups with drag and drop, paper modes (None/Numbers/Lines/Grid), CodeMirror 6 editor, remark/rehype Markdown preview (GFM, footnotes, front matter, KaTeX, Mermaid, highlight, sanitised HTML), save model with crash recovery, Quick Note bubble, Settings incl. Windows integration page.\u003c/li>\n\u003cli>Platform layer split: \u003ccode>platform/tauri.ts\u003c/code> (real app) and \u003ccode>platform/mock.ts\u003c/code> (browser build for screenshots).\u003c/li>\n\u003cli>56 vitest tests (encodings, Notepad argv, tree ops, Markdown pipeline). 15-screen Playwright tour in \u003ccode>app/e2e/\u003c/code>.\u003c/li>\n\u003cli>Session ended before the Rust side was written and before this record was updated.\u003c/li>\n\u003c/ul>\n\u003ch2>2026-09-27 22:48 native shell (developer agent)\u003c/h2>\n\u003cul>\n\u003cli>Wrote \u003ccode>app/src-tauri/\u003c/code>: \u003ccode>lib.rs\u003c/code> (21 commands matching \u003ccode>platform/tauri.ts\u003c/code>, tray with menu, left-click toggles Quick Note, double-click opens main, Win+Alt+N global hotkey, single-instance forwarding argv to the running window, Quick Note close = hide), \u003ccode>files.rs\u003c/code> (atomic save via temp + fsync + rename, app store under \u003ccode>%APPDATA%\\Notepad2\u003c/code> with path-escape guard), \u003ccode>integration.rs\u003c/code> (HKCU ProgIDs + Capabilities + RegisteredApplications, UserChoice/UserChoiceLatest detection, IFEO via self-elevated helper, context menu, Run key, uninstall cleanup), \u003ccode>main.rs\u003c/code> (helper modes before app start).\u003c/li>\n\u003cli>\u003ccode>tauri.conf.json\u003c/code>: two windows (main frameless, quicknote frameless/always-on-top/skip-taskbar, both start hidden), CSP, asset protocol for local images, NSIS per-user + MSI, WebView2 bootstrapper. \u003ccode>capabilities/default.json\u003c/code> for both windows.\u003c/li>\n\u003cli>Icon: original page + blue &quot;2&quot; badge (no Microsoft artwork), generated to \u003ccode>.ico\u003c/code>/\u003ccode>.png\u003c/code> from \u003ccode>assets/icon/app-icon.svg\u003c/code>.\u003c/li>\n\u003cli>NSIS uninstall hook runs \u003ccode>notepad2.exe --np2-cleanup\u003c/code>.\u003c/li>\n\u003cli>\u003ccode>.github/workflows/build-windows.yml\u003c/code>: Linux job (typecheck, vitest, vite build) then windows-latest job (cargo test, \u003ccode>tauri build\u003c/code>, upload installers, attach to release on \u003ccode>v*\u003c/code> tags).\u003c/li>\n\u003cli>Frontend fix: main window now shows itself after init (it starts hidden to avoid a blank flash); \u003ccode>--hidden\u003c/code> and \u003ccode>--quicknote\u003c/code> keep it in the tray.\u003c/li>\n\u003cli>Verified: \u003ccode>cargo check --target x86_64-pc-windows-msvc\u003c/code> clean (resource compiler stubbed on Linux, real on CI), 9/9 Rust unit tests, 56/56 vitest, typecheck clean, vite build OK, 15-screen tour with zero console errors.\u003c/li>\n\u003cli>Not verified: an actual Windows run. Needs the CI build or a local \u003ccode>npx tauri build\u003c/code> on the Home PC.\u003c/li>\n\u003c/ul>\n"}];var i=0;var nav=document.getElementById('nav');
P.forEach(function(p,k){var b=document.createElement('button');b.textContent=p.title;b.onclick=function(){show(k)};nav.appendChild(b)});
function show(k){i=Math.max(0,Math.min(P.length-1,k));document.getElementById('doc').innerHTML=P[i].html;
document.getElementById('pos').textContent=(i+1)+' / '+P.length+'  ·  '+P[i].file;
Array.prototype.forEach.call(nav.children,function(b,n){b.className=n===i?'on':''});document.querySelector('main').scrollTop=0}
document.getElementById('prev').onclick=function(){show(i-1)};document.getElementById('next').onclick=function(){show(i+1)};
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight')show(i+1);if(e.key==='ArrowLeft')show(i-1)});
show(0);
</script></body></html>
